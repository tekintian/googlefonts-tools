name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: 0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          APP=googlefonts-tools
          VERSION=${{ steps.version.VERSION }}
          DIST=dist

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$PLATFORM"
            OUTPUT="${DIST}/${APP}_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              OUTPUT="${OUTPUT}.exe"
            fi

            echo "Building ${PLATFORM}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X main.AppVersion=${VERSION}" -o "$OUTPUT" .
          done

      - name: Package
        run: |
          APP=googlefonts-tools
          VERSION=${{ steps.version.VERSION }}
          DIST=dist
          PACKAGE=release

          mkdir -p "$PACKAGE"
          cp config.ini "$DIST/"

          for FILE in "$DIST"/*; do
            BASENAME=$(basename "$FILE")

            case "$BASENAME" in
              *.exe)
                NAME="${BASENAME%.exe}"
                ARCHIVE="${PACKAGE}/${NAME}.zip"
                (cd "$DIST" && zip -j "${GITHUB_WORKSPACE}/${ARCHIVE}" "$BASENAME" config.ini)
                ;;
              config.ini)
                continue
                ;;
              *)
                NAME="${BASENAME}"
                ARCHIVE="${PACKAGE}/${NAME}.tar.gz"
                (cd "$DIST" && tar czf "${GITHUB_WORKSPACE}/${ARCHIVE}" "$BASENAME" config.ini)
                ;;
            esac
          done

      - name: Generate Checksums
        run: |
          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.VERSION, '-') }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APPVERSION=${{ steps.version.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/googlefonts-tools:latest
            ghcr.io/${{ github.repository_owner }}/googlefonts-tools:${{ steps.version.VERSION }}