name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CGO_ENABLED: 0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          APP=googlefonts-tools
          VERSION=${{ steps.version.VERSION }}
          DIST=dist

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$PLATFORM"
            OUTPUT="${DIST}/${APP}_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              OUTPUT="${OUTPUT}.exe"
            fi

            echo "Building ${PLATFORM}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X main.AppVersion=${VERSION}" -o "$OUTPUT" .
          done

      - name: Package
        run: |
          APP=googlefonts-tools
          VERSION=${{ steps.version.VERSION }}
          DIST=dist
          PACKAGE=release

          mkdir -p "$PACKAGE"

          for FILE in "$DIST"/*; do
            BASENAME=$(basename "$FILE")
            NAME="${BASENAME%.*}"
            EXT="${BASENAME##*.}"

            if [ "$EXT" = "exe" ]; then
              ARCHIVE="${PACKAGE}/${NAME}.zip"
              cp config.ini "$DIST/"
              (cd "$DIST" && zip -j "$ARCHIVE" "$(basename "$FILE")" config.ini)
            else
              ARCHIVE="${PACKAGE}/${NAME}.tar.gz"
              cp config.ini "$DIST/"
              (cd "$DIST" && tar czf "$ARCHIVE" "$(basename "$FILE")" config.ini)
            fi
          done

      - name: Generate Checksums
        run: |
          (cd release && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.VERSION, '-') }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt